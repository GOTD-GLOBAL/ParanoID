[workspace]
members = ["crates/identity-core"]
resolver = "3"

[workspace.package]
authors = ["ParanoID contributors"]
edition = "2024"
publish = false
repository = "https://github.com/GOTD-GLOBAL/ParanoID"
rust-version = "1.97.1"

[workspace.dependencies]
bip39 = { version = "2.2.2", default-features = false, features = ["std", "unicode-normalization", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
