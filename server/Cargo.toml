[package]
name = "paranoid-server"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
rand = "=0.8.8"
paranoid-key-protocol = { path = "../key-protocol" }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
vodozemac = "=0.10.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["json"] }
