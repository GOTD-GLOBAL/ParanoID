[package]
name = "paranoid-key-protocol"
version = "0.0.1"
edition = "2021"
publish = false
[dependencies]
vodozemac = "=0.10.0"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
uuid = { version = "=1.18.1", features = ["v4"] }
curve25519-dalek = "=4.1.3"
getrandom = "=0.2.17"

[dev-dependencies]
serde_json = "1"
uuid = { version = "=1.18.1", features = ["v4"] }
