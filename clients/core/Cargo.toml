[package]
name = "paranoid-client-core"
version = "0.0.1"
edition = "2021"
publish = false
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
vodozemac = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
uuid = { version = "=1.18.1", features = ["v4"] }
sha2 = "=0.10.9"
jni = "=0.21.1"
