[package]
name = "paranoid-ios-bridge"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "paranoid_ios_bridge"
# `rlib` exists only for `tests/abi.rs`, `cargo clippy --all-targets` and the
# host `cargo test` run; the xcframework is assembled from the `staticlib`
# (`libparanoid_ios_bridge.a`) alone.
crate-type = ["staticlib", "rlib"]

[dependencies]
paranoid-client-core = { path = "../../core" }
paranoid-devnet-client = { path = "../../../blockchain/solana/client" }
serde_json = "1"
zeroize = "=1.9.0"
# RFC-0030: unify the Devnet hash backend without C/assembly or an Apple SDK.
blake3 = { version = "=1.8.7", features = ["pure"] }
