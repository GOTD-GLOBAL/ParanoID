[package]
name = "paranoid-devnet-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bip39 = { version = "=3.0.0", features = ["zeroize"] }
ed25519-dalek-bip32 = "=0.3.0"
solana-address = { version = "=2.6.1", features = ["curve25519"] }
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.2.4"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["serde", "wincode", "verify"] }
solana-hash = "=4.5.0"
solana-short-vec = "=3.2.2"
solana-signature = "=3.4.1"
bincode = "=1.3.3"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.0"
jni = "=0.21.1"
