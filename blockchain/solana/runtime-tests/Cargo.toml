[package]
name = "paranoid-registry-runtime-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
litesvm = "=0.16.0"
solana-address = { version = "=2.6.1", features = ["curve25519", "rand"] }
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.2.4"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["serde"] }
paranoid-devnet-client = { path = "../client" }
bincode = "=1.3.3"
base64 = "=0.22.1"
serde_json = "=1.0.151"
solana-account = "=4.3.2"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
