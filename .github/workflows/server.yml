name: Server transport
# Called only by .github/workflows/ci.yml, for every pull request and every
# push to main, without path filters (see that file).
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl python3-cryptography
          rustup toolchain install 1.98.1 --profile minimal
      - name: Package negative regressions and real initialization
        run: |
          python3 deploy/test_build.py
          python3 deploy/test_containment.py
          python3 deploy/test_package.py
      - name: Offline TURN package and versioned controller regressions
        # These tests open no relay sockets and do not imply allocation/media acceptance.
        run: |
          python3 deploy/turn/test_package.py
          python3 deploy/turn/test_runtime.py
          python3 deploy/turn/test_systemd_credentials.py
          python3 deploy/test_turn_environment.py
          python3 deploy/test_push_environment.py
      - name: Unified installer offline safety and ownership regressions
        # No service, firewall, packet, namespace or privileged credential test runs here.
        run: |
          python3 deploy/test_single_host.py
          python3 deploy/test_single_host_message.py
          python3 deploy/test_single_host_network.py
          python3 deploy/test_single_host_credentials.py
          python3 deploy/test_single_host_rehearsal.py
          python3 deploy/test_single_host_vm.py
          python3 deploy/test_reconcile_apk_cap_20260913.py
          python3 deploy/test_restore_active_after_rollback.py
      - name: Packaged v2 encrypted backup, optional FCM schema and interrupt gates
        # Fresh disposable PG only; fixed command, no untrusted event interpolation.
        # One-off live helpers are never executed here.
        run: python3 scripts/check-v2-maintenance.py
      - name: Real packaged PostgreSQL TLS update and rollback (no systemd)
        # test_integration.py needs an explicitly provisioned user manager; never discover it here.
        run: python3 deploy/test_native.py
  server-lint:
    # Format, lint and the CI wiring contract, once per change. The server tests
    # themselves run in the parallel postgres-http shards below.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --manifest-path server/Cargo.toml -- --check
      - name: Lint
        run: cargo +1.98.1 clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: CI wiring regression
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 scripts/test-ci-wiring.py
  postgres-http:
    # The whole server suite, split into parallel shards that each run on their
    # own runner and their own private PostgreSQL. Every test runs exactly once,
    # unchanged and with its real five-minute expiry and TLS lifetime waits.
    # Before running, each shard proves its selection against libtest's own list
    # (scripts/check-server.py SHARDS); the catch-all `rest` owns every new test.
    name: postgres-http (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Longest shard: about 5.5 minutes of real-time tests plus a cold build.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [realtime-expiry, realtime-limits, rest]
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Private PostgreSQL prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl curl python3-cryptography
      - name: Real PostgreSQL and HTTP tests (one shard, private socket)
        run: python3 scripts/check-server.py --shard "$SHARD"
  client-core-and-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Client core (supported security gates)
        run: |
          cargo +1.98.1 fmt --manifest-path clients/core/Cargo.toml -- --check
          cargo +1.98.1 clippy --locked --manifest-path clients/core/Cargo.toml --all-targets -- -D warnings
          # Only the frozen pre-v7 self_service target runs in the separate RED job.
          # Discover every other integration target so future tests gate by default.
          tests=()
          for source in clients/core/tests/*.rs; do
            name="$(basename "$source" .rs)"
            if [[ "$name" != self_service ]]; then tests+=(--test "$name"); fi
          done
          cargo +1.98.1 test --locked --release --manifest-path clients/core/Cargo.toml --lib --bins "${tests[@]}"
          # Supported tests in the mixed historical target still gate. The exact
          # 14 archived failures run WITHOUT these exclusions in the legacy job.
          legacy=()
          while IFS= read -r name; do legacy+=(--skip "$name"); done < scripts/ci-legacy-client-tests.txt
          cargo +1.98.1 test --locked --release --manifest-path clients/core/Cargo.toml --test self_service -- --exact "${legacy[@]}"
          cargo +1.98.1 test --locked --manifest-path clients/core/Cargo.toml --doc
          cargo +1.98.1 build --locked --manifest-path clients/core/Cargo.toml
      - name: JVM JNI and snapshot codec
        # RUNNER_TEMP is runner-owned; no PR body/title/ref is interpolated here.
        # -sourcepath (production text package only): a same-package class
        # missing from the list compiles implicitly, while a dependency on
        # another package still fails (clients/android/test_host_sourcepath.py).
        run: |
          mkdir -p "$RUNNER_TEMP/paranoid-java"
          javac --release 8 -sourcepath clients/android/src -d "$RUNNER_TEMP/paranoid-java" clients/android/src/org/paranoid/text/CoreBridge.java clients/android/src/org/paranoid/text/SnapshotCodec.java clients/android/src/org/paranoid/text/SyncCycle.java clients/android/test/CoreSmoke.java clients/android/test/StorageSmoke.java clients/android/test/SyncSmoke.java
          java -Djava.library.path=clients/core/target/debug -cp "$RUNNER_TEMP/paranoid-java" CoreSmoke
          java -cp "$RUNNER_TEMP/paranoid-java" StorageSmoke
          java -cp "$RUNNER_TEMP/paranoid-java" SyncSmoke
      - name: Real local pinned-TLS handshakes
        run: python3 scripts/check-pinned-tls.py
      - name: Voice consent lifecycle, relay metadata and durable JNI callback boundary
        run: |
          python3 clients/android/dependencies.py
          python3 clients/android/test_realtime_transport.py --evidence-dir "$RUNNER_TEMP/paranoid-transport"
          python3 clients/android/test_call_controller.py
          python3 clients/android/test_call_log.py
          python3 clients/android/test_message_presentation.py
          python3 clients/android/test_receipt_presentation.py
          python3 clients/android/test_message_time.py
          python3 clients/android/test_ui_contract.py
          python3 clients/android/test_nickname_profile_lifecycle.py
          python3 clients/android/test_share_link.py
          python3 clients/android/test_update_page.py
          python3 clients/android/test_crash_exit.py
          python3 clients/android/test_voice_relay.py
          python3 clients/android/test_host_sourcepath.py
          javac --release 8 -Xlint:-options -sourcepath clients/android/src -cp clients/android/out/deps/json-20240303.jar:clients/android/out/deps/zxing-core-3.5.3.jar -d "$RUNNER_TEMP/paranoid-java" clients/android/src/org/paranoid/text/{CoreBridge,PinnedTls,SnapshotCodec,SyncCycle,KeyClient,KeyTransport,IdentityPorts,SelfServiceClient,QrCodec,StorageGuard,DialogPolicy,RealtimeLoop,RealtimeTransport,VoiceRelayConfig,VoiceRelayTransport}.java clients/android/test/VoiceCommitSmoke.java
          java -Djava.library.path=clients/core/target/debug -cp "$RUNNER_TEMP/paranoid-java":clients/android/out/deps/json-20240303.jar VoiceCommitSmoke
          python3 clients/android/test_voice_relay_lane.py --jni-library-dir clients/core/target/debug --evidence-dir "$RUNNER_TEMP/paranoid-voice-lane"
      - name: Android update transport and installer worker host gates
        # Synthetic bytes, local TLS only: no signing key, APK build or device claim.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
          python3 clients/android/test_updates.py --synthetic
          python3 clients/android/test_update_wiring.py
          python3 clients/android/test_update_session_worker.py
  devnet-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Offline Devnet native and Android integration gates
        # Fixed commands only; no event interpolation, signing secrets or live RPC.
        # Exact SBF pin and Android runtime acceptance remain separate artifact gates.
        run: |
          cargo +1.98.1 fmt --manifest-path blockchain/solana/client/Cargo.toml -- --check
          cargo +1.98.1 clippy --locked --manifest-path blockchain/solana/client/Cargo.toml --all-targets -- -D warnings
          cargo +1.98.1 test --locked --manifest-path blockchain/solana/client/Cargo.toml
          cargo +1.98.1 build --locked --manifest-path blockchain/solana/client/Cargo.toml
          # notices.py reads BOTH lockfiles offline, including on a cold runner.
          cargo +1.98.1 fetch --locked --manifest-path clients/core/Cargo.toml
          python3 clients/android/dependencies.py
          python3 clients/android/test_devnet_integration.py
          python3 clients/android/test_devnet_notices.py
          JSON_JAR="$GITHUB_WORKSPACE/clients/android/out/deps/json-20240303.jar" python3 clients/android-devnet/check_controller.py
  legacy-client-history:
    name: Legacy client history (exact known failures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Run the whole unchanged pre-v7 target and require the exact known failures
        # Runs the whole `--test self_service` target without exclusions. REQ-MSG-005
        # excludes this historical target from clean-v7/v8 gates; its 14 listed
        # failures are retained, not fixed or waived. The job passes only when
        # exactly those 14 fail and every other test passes: any new failure, a
        # listed test that starts passing, a missing test or a build error turns
        # it red. Raw cargo exit and every name go to the log and step summary.
        run: python3 scripts/check-legacy-failures.py
