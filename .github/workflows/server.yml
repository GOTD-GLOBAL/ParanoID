name: Server transport
on:
  pull_request:
    paths: ["server/**", "scripts/check-server.py", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "scripts/check-server.py", ".github/workflows/server.yml"]
permissions:
  contents: read
jobs:
  postgres-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: paranoid_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: paranoid_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paranoid_test -d paranoid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARANOID_CI_TEST_DATABASE: "1"
      PARANOID_TEST_DATABASE_URL: postgres://paranoid_test:disposable_ci_only@127.0.0.1:5432/paranoid_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --manifest-path server/Cargo.toml -- --check
      - name: Lint
        run: cargo +1.98.1 clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Real PostgreSQL and HTTP tests
        run: cargo +1.98.1 test --locked --manifest-path server/Cargo.toml -- --test-threads=1
