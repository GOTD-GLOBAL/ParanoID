name: External links (weekly)

# External documentation links, once a week and on demand. This workflow runs
# on no pull request or push, so it is never part of `gate`. A dead external
# link opens or updates one issue instead of blocking unrelated changes;
# internal links and anchors stay strict on every change (docs.yml).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-weekly
  cancel-in-progress: false

jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check every external link
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Exclusions are shared with docs.yml through .lycheeignore.
          args: >-
            --no-progress
            --max-retries 4
            --retry-wait-time 5
            './**/*.md'
          output: lychee/out.md
          fail: false

      - name: Open or update the link-rot issue
        if: steps.lychee.outputs.exit_code != '0'
        # Fixed title and body file only; no event text is interpolated.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly external link check found dead links"
          {
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'Fix the document, or add a justified line to %s.\n\n' '.lycheeignore'
            cat lychee/out.md
          } > "$RUNNER_TEMP/link-report.md"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/link-report.md"
          else
            gh issue create --title "$title" --label documentation --body-file "$RUNNER_TEMP/link-report.md"
          fi
