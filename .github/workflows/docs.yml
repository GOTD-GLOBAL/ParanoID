name: Documentation

# Called only by .github/workflows/ci.yml, for every pull request and every
# push to main, without path filters (see that file).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    # Usually under a minute; bounds a hung link or RPC check (default is 6 h).
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20

      - name: Verify Devnet citations through read-only RPC
        # Explorer HTML returns bot429; verify the exact on-chain objects instead.
        # No wallet, credentials, airdrop, signing or submission. Network errors fail.
        run: |
          python3 scripts/test-devnet-receipt.py
          python3 scripts/check-devnet-receipt.py

      - name: Check internal links and anchors
        # Strict on every change and fully deterministic: every relative link
        # and every #anchor into a repository file must resolve. No network:
        # external URLs are checked weekly by links-weekly.yml, so a third-party
        # outage or a dead outside page never blocks a pull request.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            './**/*.md'
          fail: true
