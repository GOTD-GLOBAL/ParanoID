name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"
      - "scripts/check-devnet-receipt.py"
      - "scripts/test-devnet-receipt.py"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"
      - "scripts/check-devnet-receipt.py"
      - "scripts/test-devnet-receipt.py"

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20

      - name: Verify Devnet citations through read-only RPC
        # Explorer HTML returns bot429; verify the exact on-chain objects instead.
        # No wallet, credentials, airdrop, signing or submission. Network errors fail.
        run: |
          python3 scripts/test-devnet-receipt.py
          python3 scripts/check-devnet-receipt.py

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Private PR provenance is verified through authenticated GitHub API calls.
          args: >-
            --no-progress
            --exclude '^https://explorer\.solana\.com/address/C8e5quz3JqepRZ4Mgj4L6PctGfdFpEo52t66WPBpgvas\?cluster=devnet$'
            --exclude '^https://explorer\.solana\.com/tx/4dFfANwtzdq6iEwBM1GTd2iYLFowe3xXQBrBPYdjqxPSAwVPT6VNP3EnCuLwuHzhdJDc6NT3tywRYrCxyMk6PH1a\?cluster=devnet$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/53#issuecomment-5771635821$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/4$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/4#issuecomment-5311797500$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/12$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/12#issuecomment-5581548687$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/14#issuecomment-5587328763$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/16$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/19$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/16#issuecomment-5609070441$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/18$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/actions/runs/34406605403$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/commit/f45519ebe1c44ab2f34b3707c57703fce4583fa6$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/15#issuecomment-5588484192$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/20$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/19#issuecomment-5613364943$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/19#issuecomment-5614383522$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/27$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/issues/27#issuecomment-5651949919$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/45#issuecomment-5714820519$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/45#issuecomment-5715733752$'
            --exclude '^https://github\.com/GOTD-GLOBAL/ParanoID/pull/46#issuecomment-5715736976$'
