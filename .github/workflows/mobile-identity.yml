name: Mobile identity conformance

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-identity.yml"
      - "clients/shared/identity-conformance/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "specs/protocol/identity/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-identity.yml"
      - "clients/shared/identity-conformance/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "specs/protocol/identity/**"

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

  jvm-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run JVM and Android host tests
        run: >-
          ./gradlew
          :clients:shared:identity-conformance:jvmTest
          :clients:shared:identity-conformance:testAndroidHostTest
          --no-daemon

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run iOS simulator tests
        run: >-
          ./gradlew
          :clients:shared:identity-conformance:iosSimulatorArm64Test
          --no-daemon
